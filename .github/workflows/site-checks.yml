name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install Pillow==12.3.0
      - run: node --test scripts/sync-instagram-feed.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:routing
      - run: google-chrome --version
      - run: npm run check:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
