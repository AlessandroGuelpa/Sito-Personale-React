name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:routing
      - run: google-chrome --version
      - run: npm run check:header
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-browser-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
